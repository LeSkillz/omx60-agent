name: OMX60-agenten

# Cron i GitHub Actions gar alltid i UTC.
#   05:30 UTC = 07:30 svensk sommartid / 06:30 vintertid  -> fore borsoppning (09:00)
#   17:05 UTC = 19:05 svensk sommartid / 18:05 vintertid  -> efter stangning (17:30)
# Bada tiderna ligger ratt aret om trots sommartidsomstallningen.
on:
  schedule:
    - cron: "30 5 * * 1-5"
    - cron: "5 17 * * 1-5"
  workflow_dispatch:
    inputs:
      lage:
        description: "Vilket steg som ska koras"
        required: true
        default: morgon
        type: choice
        options: [morgon, kvall]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: omx-agent
  cancel-in-progress: false

jobs:
  kor:
    runs-on: ubuntu-latest
    steps:
      # ref: main gor att aven "Re-run jobs" hamtar senaste koden i stallet for
      # den commit korningen ursprungligen startade pa. Utan detta kor en
      # omkorning gammal kod och forsoker spara ovanpa en main som hunnit vidare.
      # fetch-depth: 0 behovs for att rebase ska fungera i sparningssteget.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bestam lage
        id: lage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "v=${{ inputs.lage }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 5 * * 1-5" ]; then
            echo "v=morgon" >> $GITHUB_OUTPUT
          else
            echo "v=kvall" >> $GITHUB_OUTPUT
          fi

      - name: Hamta kursdata
        working-directory: scripts
        run: python fetch_data.py

      - name: Kvalitativ research
        if: steps.lage.outputs.v == 'morgon'
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python research.py
        continue-on-error: true

      - name: Morgonanalys
        if: steps.lage.outputs.v == 'morgon'
        working-directory: scripts
        run: python run_morning.py

      - name: Kvallsutvardering
        if: steps.lage.outputs.v == 'kvall'
        working-directory: scripts
        run: python run_evening.py

      - name: Bygg dashboard
        working-directory: scripts
        run: |
          python build_report.py
          mkdir -p ../docs
          cp ../report/index.html ../docs/index.html

      - name: Spara agentens minne
        run: |
          set -e
          git config user.name "omx-agent"
          git config user.email "actions@github.com"
          git add -A data config docs memory || true

          if git diff --staged --quiet; then
            echo "Inget nytt att spara."
            exit 0
          fi
          git commit -m "Agentkorning ${{ steps.lage.outputs.v }} $(date -u +%Y-%m-%dT%H:%M)"

          # Prisfilerna skrivs om i sin helhet varje korning, sa en vanlig
          # rebase ger add/add-konflikt i varenda CSV. Agentens nyss genererade
          # filer ar alltid facit - darav -X theirs, som under rebase syftar pa
          # commiten som spelas upp, alltsa var egen.
          for forsok in 1 2 3; do
            if git push; then
              echo "Sparat."
              exit 0
            fi
            echo "Push avvisad, fjarrgrenen har andrats. Forsok $forsok av 3."
            git fetch origin main
            if ! git -c core.editor=true rebase -X theirs origin/main; then
              echo "Rebase gick inte att losa automatiskt, aterstaller."
              git rebase --abort || true
              exit 1
            fi
          done

          echo "Kunde inte spara agentens minne efter tre forsok."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicera:
    needs: kor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
